kind = "web"
previewPath = "/"
title = "Véu Partido"
version = "1.0.0"
id = "artifacts/veu-partido"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21250

[services.development]
run = "pnpm --filter @workspace/veu-partido run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/veu-partido", "run", "build" ]
publicDir = "artifacts/veu-partido/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21250"
BASE_PATH = "/"
